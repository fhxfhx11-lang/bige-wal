<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اعدادات الموقع</title>
  <meta name="description" content="اعدادات الموقع وكلمة المرور" />

  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#0f172a;
      --ink-2:#1e293b;
      --muted:#6b7280;
      --line:rgba(15,23,42,.08);
      --brand:#0ea5e9;
      --brand-2:#22d3ee;
      --accent:#f59e0b;
      --paper:#f8fafc;
      --card:#ffffff;
      --shadow:0 22px 60px rgba(15,23,42,.14);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Tajawal", system-ui, sans-serif;
      background:
        radial-gradient(800px 480px at 85% -10%, rgba(14,165,233,.18), transparent 60%),
        radial-gradient(700px 420px at 5% 20%, rgba(245,158,11,.12), transparent 60%),
        linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      color:var(--ink);
      min-height:100vh;
    }
    body::before{
      content:"";
      position:fixed;
      inset:-20%;
      background:
        radial-gradient(500px 260px at 20% 80%, rgba(34,211,238,.12), transparent 60%),
        radial-gradient(560px 300px at 70% 60%, rgba(14,165,233,.10), transparent 60%);
      filter: blur(10px);
      z-index:-1;
    }

    a{color:inherit; text-decoration:none}
    .container{max-width:980px; margin:0 auto; padding:0 18px}

    header{
      position:sticky; top:0; z-index:20;
      background: rgba(248,250,252,.8);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 0;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      font-family:"El Messiri", serif; font-weight:700; font-size:20px;
    }
    .logo{
      width:44px; height:44px; border-radius:14px;
      display:grid; place-items:center;
      background:linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#0f172a; font-weight:800;
      box-shadow:0 12px 30px rgba(14,165,233,.18);
    }
    .nav-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

    .btn{
      border:none; cursor:pointer;
      padding:10px 14px; border-radius:14px;
      background:linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#0f172a; font-weight:800;
      transition:.18s ease;
    }
    .btn:hover{transform: translateY(-1px)}
    .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink-2)}
    .btn.warning{background:linear-gradient(135deg, #fbbf24, #f97316)}

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
      margin-top:18px;
    }
    .card h2{margin:0 0 6px; font-size:18px}
    .card p{margin:0; color:var(--muted)}

    .form-grid{
      display:grid; gap:12px; margin-top:14px;
      grid-template-columns: repeat(2, 1fr);
    }
    .field{display:flex; flex-direction:column; gap:6px}
    .field label{font-weight:700; font-size:13px}
    .field input, .field textarea{
      padding:11px; border-radius:12px; border:1px solid var(--line);
      background:#fff; outline:none; font-family:inherit; font-size:14px;
    }
    .field textarea{min-height:90px; resize:vertical}
    .full{grid-column:1/-1}

    .status{margin-top:10px; padding:10px 12px; border-radius:12px; background:#f8fafc; border:1px dashed var(--line); color:var(--muted)}

    .gate{
      position:fixed; inset:0; background:rgba(15,23,42,.6);
      display:flex; align-items:center; justify-content:center; padding:18px; z-index:50;
    }
    .gate-card{
      width:min(420px, 100%);
      background:#fff; border-radius:20px; padding:20px; box-shadow:var(--shadow);
    }

    @media (max-width: 900px){
      .form-grid{grid-template-columns:1fr}
      .nav{flex-direction:column; align-items:flex-start}
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="nav">
        <div class="brand">
          <div class="logo">ن</div>
          اعدادات الموقع
        </div>
        <div class="nav-actions">
          <button class="btn ghost" id="connectBtn">ربط مجلد الموقع</button>
          <a class="btn ghost" href="../">المنشورات</a>
          <button class="btn warning" id="logoutBtn">تسجيل خروج</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>بيانات الموقع</h2>
      <p>عدل معلومات الواجهة مباشرة.</p>

      <form id="settingsForm" class="form-grid">
        <div class="field">
          <label>اسم الموقع</label>
          <input id="siteName" />
        </div>
        <div class="field">
          <label>العنوان الفرعي</label>
          <input id="tagline" />
        </div>
        <div class="field">
          <label>نص الشعار</label>
          <input id="logoText" />
        </div>
        <div class="field">
          <label>رابط صورة الشعار (اختياري)</label>
          <input id="logoImage" placeholder="logo.png" />
        </div>
        <div class="field">
          <label>رقم واتساب دولي</label>
          <input id="whatsapp" />
        </div>
        <div class="field">
          <label>وصف الميتا (اختياري)</label>
          <input id="description" />
        </div>
        <div class="field full">
          <label>نص من نحن</label>
          <textarea id="about"></textarea>
        </div>
        <div class="field full">
          <label>الفروع (كل سطر: الاسم | العنوان)</label>
          <textarea id="branches"></textarea>
        </div>
        <div class="field full">
          <label>اوقات الدوام</label>
          <input id="hours" />
        </div>

        <div class="full" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;">
          <button class="btn" type="submit">حفظ الاعدادات</button>
        </div>
      </form>
      <div class="status" id="saveStatus">جاهز.</div>
    </section>

    <section class="card">
      <h2>تغيير كلمة المرور</h2>
      <p>يتم حفظها في ملف الكونفق.</p>

      <form id="passwordForm" class="form-grid">
        <div class="field">
          <label>كلمة المرور الحالية</label>
          <input id="currentPassword" type="password" />
        </div>
        <div class="field">
          <label>كلمة المرور الجديدة</label>
          <input id="newPassword" type="password" />
        </div>
        <div class="full" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;">
          <button class="btn" type="submit">حفظ كلمة المرور</button>
        </div>
      </form>
      <div class="status" id="passwordStatus">جاهز.</div>
    </section>
  </main>

  <div class="gate" id="gate" style="display:none;">
    <div class="gate-card">
      <h3 style="margin:0 0 6px; font-family:'El Messiri', serif;">تسجيل دخول لوحة التحكم</h3>
      <p class="muted">ادخل كلمة المرور المحفوظة في ملف الكونفق.</p>
      <div class="field" style="margin-top:10px;">
        <label>كلمة المرور</label>
        <input id="passwordInput" type="password" />
      </div>
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="btn" id="loginBtn">دخول</button>
      </div>
      <div class="muted" id="loginStatus" style="margin-top:8px;"></div>
    </div>
  </div>

  <script>
    const CONFIG_PATH = "../config.json";
    const SESSION_KEY = "dashbord_auth";

    const connectBtn = document.getElementById("connectBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const gate = document.getElementById("gate");
    const loginBtn = document.getElementById("loginBtn");
    const loginStatus = document.getElementById("loginStatus");
    const passwordInput = document.getElementById("passwordInput");

    const settingsForm = document.getElementById("settingsForm");
    const passwordForm = document.getElementById("passwordForm");
    const saveStatus = document.getElementById("saveStatus");
    const passwordStatus = document.getElementById("passwordStatus");

    const siteName = document.getElementById("siteName");
    const tagline = document.getElementById("tagline");
    const logoText = document.getElementById("logoText");
    const logoImage = document.getElementById("logoImage");
    const whatsapp = document.getElementById("whatsapp");
    const description = document.getElementById("description");
    const about = document.getElementById("about");
    const branches = document.getElementById("branches");
    const hours = document.getElementById("hours");
    const currentPassword = document.getElementById("currentPassword");
    const newPassword = document.getElementById("newPassword");

    let config = null;
    let rootHandle = null;

    function showGate(show){ gate.style.display = show ? "flex" : "none"; }

    async function loadConfig(){
      try{
        const res = await fetch(CONFIG_PATH, { cache: "no-store" });
        if(!res.ok) return null;
        return await res.json();
      }catch(e){
        return null;
      }
    }

    async function ensureAuth(){
      config = await loadConfig();
      const saved = sessionStorage.getItem(SESSION_KEY);
      if(saved === "ok"){
        showGate(false);
        fillForm();
        return true;
      }
      showGate(true);
      return false;
    }

    async function connectRoot(){
      if(!window.showDirectoryPicker){
        alert("متصفحك لا يدعم ربط المجلد. استخدم كروم او ايدج.");
        return;
      }
      try{
        const handle = await window.showDirectoryPicker({ id: "site-root" });
        const perm = await handle.requestPermission({ mode: "readwrite" });
        if(perm !== "granted"){
          alert("تم رفض الصلاحيات.");
          return;
        }
        rootHandle = handle;
      }catch(e){
        console.warn(e);
      }
    }

    function fillForm(){
      if(!config || !config.site) return;
      const site = config.site;
      siteName.value = site.name || "";
      tagline.value = site.tagline || "";
      logoText.value = site.logoText || "";
      logoImage.value = site.logoImage || "";
      whatsapp.value = site.whatsapp || "";
      description.value = site.description || "";
      about.value = site.about || "";
      hours.value = site.hours || "";

      if(Array.isArray(site.branches)){
        branches.value = site.branches.map(b=>`${b.name || ""} | ${b.address || ""}`).join("\n");
      }else{
        branches.value = "";
      }
    }

    async function writeConfig(){
      if(!rootHandle){
        saveStatus.textContent = "يجب ربط مجلد الموقع اولا.";
        return false;
      }
      const dashDir = await rootHandle.getDirectoryHandle("dashbord", { create: true });
      const handle = await dashDir.getFileHandle("config.json", { create: true });
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(config, null, 2));
      await writable.close();
      return true;
    }

    function parseBranches(raw){
      return raw.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{
        const parts = line.split("|");
        return { name: (parts[0] || "").trim(), address: (parts[1] || "").trim() };
      });
    }

    settingsForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      if(!config) return;
      config.site = config.site || {};
      config.site.name = siteName.value.trim();
      config.site.tagline = tagline.value.trim();
      config.site.logoText = logoText.value.trim();
      config.site.logoImage = logoImage.value.trim();
      config.site.whatsapp = whatsapp.value.trim();
      config.site.description = description.value.trim();
      config.site.about = about.value.trim();
      config.site.hours = hours.value.trim();
      config.site.branches = parseBranches(branches.value);

      const ok = await writeConfig();
      saveStatus.textContent = ok ? "تم حفظ الاعدادات." : saveStatus.textContent;
    });

    passwordForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      if(!config) return;
      if(currentPassword.value !== config.password){
        passwordStatus.textContent = "كلمة المرور الحالية غير صحيحة.";
        return;
      }
      if(!newPassword.value.trim()){
        passwordStatus.textContent = "ادخل كلمة مرور جديدة.";
        return;
      }
      config.password = newPassword.value.trim();
      const ok = await writeConfig();
      passwordStatus.textContent = ok ? "تم تحديث كلمة المرور." : passwordStatus.textContent;
      currentPassword.value = "";
      newPassword.value = "";
    });

    loginBtn.addEventListener("click", ()=>{
      if(!config){
        loginStatus.textContent = "تعذر قراءة الكونفق.";
        return;
      }
      if(passwordInput.value === config.password){
        sessionStorage.setItem(SESSION_KEY, "ok");
        showGate(false);
        fillForm();
      }else{
        loginStatus.textContent = "كلمة المرور غير صحيحة.";
      }
    });

    connectBtn.addEventListener("click", connectRoot);
    logoutBtn.addEventListener("click", ()=>{
      sessionStorage.removeItem(SESSION_KEY);
      showGate(true);
    });

    ensureAuth();
  </script>
</body>
</html>
